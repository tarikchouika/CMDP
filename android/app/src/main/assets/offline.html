<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMDP — لا يوجد اتصال</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #1a0e08; color: #faf6ee;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card { max-width: 420px; text-align: center; }
  .emblem { width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 24px;
    background: linear-gradient(180deg, #6e331c, #3a1a0c);
    display: flex; align-items: center; justify-content: center; }
  .star { color: #d9a03f; font-size: 44px; line-height: 1; }
  h1 { font-size: 20px; margin-bottom: 10px; color: #faf6ee; }
  p { font-size: 14px; line-height: 1.9; color: rgba(250,246,238,.75); margin-bottom: 22px; }
  button {
    background: #d9a03f; color: #1a0e08; border: 0; border-radius: 14px;
    padding: 13px 34px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  button:active { opacity: .85; }
  .hint { margin-top: 18px; font-size: 12px; color: rgba(250,246,238,.5); }
</style>
</head>
<body>
  <div class="card">
    <div class="emblem"><span class="star">✦</span></div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أن الجهاز غير متصل بالشبكة حالياً.<br>تحتاج المنصة الرقمية لإدارة التعاونيات إلى اتصال بالإنترنت للعمل.</p>
    <button onclick="location.href='https://cmdp.pages.dev'">إعادة المحاولة</button>
    <p class="hint">CMDP — المنصة الرقمية لإدارة التعاونيات</p>
  </div>
</body>
</html>

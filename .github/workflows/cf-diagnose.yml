name: 🔎 فحص صلاحيات Cloudflare (تشخيصي)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: فحص الحساب والصلاحيات
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 فحص
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          echo "account_id=${CF_ACCOUNT}"
          echo "--- token verify ---"
          api "https://api.cloudflare.com/client/v4/user/tokens/verify" | head -c 300; echo
          echo "--- list tunnels ---"
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/cfd_tunnel?is_deleted=false" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("success=",d.get("success"));r=d.get("result") or [];print("count=",len(r));[print("  ",t.get("name"),t.get("id"),"status=",t.get("status")) for t in r]'
          echo "--- connectivity directory services ---"
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/connectivity/directory/services" \
            | head -c 700; echo
